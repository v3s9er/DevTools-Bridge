<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevTools Bridge</title>
    <link rel="stylesheet" href="popup.css">

  <body>
    <main>
      <h1>DevTools Bridge</h1>
      <p>현재 탭을 로컬 DevTools UI에 연결합니다. 먼저 <code>start_server.cmd</code>를 실행하세요.</p>

      <p id="status" role="status" aria-live="polite"></p>
